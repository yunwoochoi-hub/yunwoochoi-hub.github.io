<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>디지털시대소비자이해 강의자료</title>
<style>
  :root { --ink:#1f2933; --muted:#5f6b7a; --line:#e3e7ec; --accent:#2f6fde; --accent-soft:#eaf1fd;
          --exam-soft:#fdecec; --exam:#c0392b; --present-soft:#eaf7ef; --present:#1e8449; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 48px; background:#f7f8fa; color:var(--ink);
         font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.65; font-size:15px; }
  .wrap { max-width:860px; margin:0 auto; }
  /* 잠금 화면 */
  #lock { max-width:380px; margin:48px auto; background:#fff; border:1px solid var(--line); border-radius:14px;
          padding:28px 24px; text-align:center; }
  #lock .icon { font-size:40px; }
  #lock h1 { font-size:20px; margin:8px 0 4px; }
  #lock p { color:var(--muted); margin:0 0 18px; font-size:14px; }
  #lock input { width:100%; padding:12px 14px; font-size:16px; border:1px solid #cdd3da; border-radius:8px; text-align:center; }
  #lock input:focus { outline:2px solid var(--accent); border-color:transparent; }
  #lock button { width:100%; margin-top:10px; padding:12px; font-size:16px; font-weight:700; color:#fff;
                 background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  #lock button:disabled { opacity:.6; cursor:wait; }
  #msg { min-height:22px; margin-top:10px; font-size:14px; color:var(--exam); }
  /* 풀린 내용 */
  header { margin-bottom:18px; }
  header .term { color:var(--accent); font-weight:700; font-size:14px; }
  header h1 { margin:4px 0 6px; font-size:26px; }
  header p { margin:0; color:var(--muted); }
  .week { background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; }
  .week summary { cursor:pointer; padding:12px 16px; display:flex; gap:12px; align-items:baseline; list-style:none; }
  .week summary::-webkit-details-marker { display:none; }
  .week summary::after { content:"▾"; margin-left:auto; color:var(--muted); }
  .week[open] summary::after { content:"▴"; }
  .wk { font-weight:800; color:var(--accent); min-width:42px; }
  .tt { font-weight:600; }
  .week.exam { background:var(--exam-soft); } .week.exam .wk { color:var(--exam); }
  .week.present { background:var(--present-soft); } .week.present .wk { color:var(--present); }
  .body { padding:0 16px 14px 70px; }
  .body ul { margin:0 0 6px; padding-left:18px; }
  .body p { margin:4px 0; font-size:14px; }
  .m { color:var(--muted); }
  .files { color:var(--muted); font-style:italic; }
  .files a { font-style:normal; color:var(--accent); font-weight:600; }
  .toolbar { text-align:right; margin-bottom:8px; }
  .toolbar button { background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; color:var(--muted); cursor:pointer; }
  @media (max-width:600px) { .body { padding-left:16px; } }
</style>
</head>
<body>
<div class="wrap">
  <form id="lock" autocomplete="off">
    <div class="icon">🔒</div>
    <h1>디지털시대소비자이해 강의자료</h1>
    <p>수강생 전용입니다. 수업에서 안내받은 입장 코드를 넣어 주세요.</p>
    <input id="code" type="password" placeholder="입장 코드" aria-label="입장 코드" autofocus>
    <button id="go" type="submit">들어가기</button>
    <div id="msg" role="alert"></div>
  </form>
  <div id="content" hidden></div>
</div>

const KEY = "lock:" + location.pathname;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim().toLowerCase()),
                                             "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}

function show(htmlText) {
  document.getElementById("lock").hidden = true;
  const c = document.getElementById("content");
  c.innerHTML = '<div class="toolbar"><button type="button" id="out">잠그기</button></div>' + htmlText;
  c.hidden = false;
  document.getElementById("out").onclick = () => { sessionStorage.removeItem(KEY); location.reload(); };
}

document.getElementById("lock").addEventListener("submit", async e => {
  e.preventDefault();
  const code = document.getElementById("code").value;
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  if (!code.trim()) { msg.textContent = "입장 코드를 넣어 주세요."; return; }
  btn.disabled = true; msg.textContent = "";
  try {
    show(await unlock(code));
    sessionStorage.setItem(KEY, code.trim().toLowerCase());   // 이 탭을 닫기 전까지는 다시 묻지 않음
  } catch (err) {
    msg.textContent = "코드가 맞지 않습니다. 다시 확인해 주세요.";
    btn.disabled = false;
  }
});

(async () => {
  const saved = sessionStorage.getItem(KEY);
  if (saved) { try { show(await unlock(saved)); } catch (e) { sessionStorage.removeItem(KEY); } }
})();
</script>
</body>
</html>
